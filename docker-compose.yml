# HookReel on one server: the app, PostgreSQL, and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# A server of its own: also set COMPOSE_PROFILES=own-https in .env. A shared server: see deploy/nginx-hookreel.conf.
services:
  db:
    image: postgres:16-alpine
    mem_limit: ${HOOKREEL_DB_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: hookreel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hookreel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookreel"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hookreel:${POSTGRES_PASSWORD}@db:5432/hookreel
      HOOKREEL_PUBLIC_URL: https://${HOOKREEL_DOMAIN:?set HOOKREEL_DOMAIN in .env}
      # On a server everyone signs in. Set HOOKREEL_ACCOUNTS=0 in .env only if the site is private to you.
      HOOKREEL_ACCOUNTS: ${HOOKREEL_ACCOUNTS:-1}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ./.git:/app/.git:ro            # only to tell which version is running, for the update notice
    # Reachable from this server only. On a server that already has a web server, point that one at this port
    # (see deploy/nginx-hookreel.conf). With the "own-https" profile, Caddy below is the web server instead.
    ports: ["127.0.0.1:${HOOKREEL_BIND_PORT:-8765}:8765"]
    # On a server shared with other apps, these keep HookReel inside its own share (all unlimited by default):
    # a memory ceiling with no swap, a processor ceiling, a lower turn at the processor when the server is busy,
    # and "stop this one first" if the whole server ever runs out of memory.
    mem_limit: ${HOOKREEL_MEM_LIMIT:-0}
    memswap_limit: ${HOOKREEL_MEM_LIMIT:-0}
    cpus: ${HOOKREEL_CPUS:-0}
    cpu_shares: ${HOOKREEL_CPU_SHARES:-1024}
    oom_score_adj: ${HOOKREEL_OOM_SCORE_ADJ:-0}

  # Only on a server HookReel has to itself: add COMPOSE_PROFILES=own-https to .env and Caddy handles HTTPS.
  caddy:
    profiles: ["own-https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      HOOKREEL_DOMAIN: ${HOOKREEL_DOMAIN}
    volumes:
      # Caddyfile fetches certificates by itself; Caddyfile.origin uses a Cloudflare origin certificate from ./secrets
      - ./deploy/${HOOKREEL_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

  # Only when YouTube refuses this server ("confirm you're not a bot"): add "youtube" to COMPOSE_PROFILES in .env,
  # with HOOKREEL_YT_PROXY=socks5://warp:1080 and HOOKREEL_YT_POT_URL=http://pot:4416. YouTube links then go out
  # through a free Cloudflare WARP address, with a PO token, instead of the server's own (often blocked) address.
  warp:
    profiles: ["youtube"]
    image: caomingjun/warp
    restart: unless-stopped
    device_cgroup_rules: ["c 10:200 rwm"]
    cap_add: [MKNOD, AUDIT_WRITE, NET_ADMIN]
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      WARP_SLEEP: 2
    volumes:
      - warp_data:/var/lib/cloudflare-warp

  pot:
    profiles: ["youtube"]
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
  warp_data:
